name: Linting and code quality check

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      packages: read
      statuses: write
      pull-requests: write
    uses: mundialis/github-workflows/.github/workflows/linting.yml@main
    with:
      VALIDATE_BASH: false
      VALIDATE_BASH_EXEC: false
      VALIDATE_DOCKERFILE_HADOLINT: false
      VALIDATE_HTML: false